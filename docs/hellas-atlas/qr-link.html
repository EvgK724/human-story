<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080c14">
  <meta name="description" content="Откройте приложение «Эллада» на iPhone или iPad по QR-коду.">
  <title>Эллада — QR-ссылка</title>
  <style>
    :root{color-scheme:dark;--bg:#080c14;--text:#eef3fa;--muted:#a8b6c9;--accent:#a6e8d2}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg)}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse at 15% 15%,#173d422f,transparent 55%),radial-gradient(ellipse at 85% 80%,#43355e2b,transparent 55%),var(--bg)}
    main{min-height:100svh;min-height:100dvh;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
    .content{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;max-width:680px;width:100%}
    .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--accent);margin:0 0 10px;text-transform:uppercase}
    h1{font-size:clamp(34px,6vw,54px);letter-spacing:-.04em;margin:0;font-weight:650}
    .subtitle{color:var(--muted);font-size:clamp(16px,2vw,19px);line-height:1.5;margin:12px 0 0}
    .qr{width:min(340px,58vmin);padding:10px;border:1px solid #a6e8d24d;border-radius:22px;background:#fff;box-shadow:0 0 50px #69dabd16,0 0 0 7px #a6e8d205;flex:none}
    .qr img{display:block;width:100%;height:auto;border-radius:12px}
    .actions{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
    .actions a{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:12px 24px;border-radius:13px;text-decoration:none;font-size:17px;font-weight:600;transition:background .15s}
    .open{background:#a6e8d2;color:#0b201a;width:min(340px,100%);box-shadow:0 0 24px #a6e8d214}
    .open:hover{background:#c2f5e5}
    .download{color:var(--accent);border:1px solid #a6e8d238}
    .download:hover{background:#a6e8d20b}
    a:focus-visible{outline:3px solid #f7d38a;outline-offset:5px}
    .address{font-size:13px;color:var(--muted);margin:0;overflow-wrap:anywhere}
    @media(orientation:landscape) and (max-height:600px){.content{display:grid;grid-template-columns:min(50vh,270px) minmax(260px,1fr);text-align:left;gap:18px 36px;max-width:820px}.qr{grid-column:1;grid-row:1/3;width:100%}.intro{grid-column:2;grid-row:1}.actions{grid-column:2;grid-row:2;align-items:flex-start;gap:10px}.eyebrow{font-size:11px;margin-bottom:6px}h1{font-size:38px}.subtitle{font-size:16px;margin-top:8px}.actions a{min-height:44px;padding:10px 18px;font-size:16px}.address{font-size:12px}}
    @media(max-height:700px) and (orientation:portrait){.content{gap:16px}.qr{width:min(265px,53vmin)}h1{font-size:34px}.subtitle{font-size:16px;margin-top:8px}.actions{gap:9px}.actions a{min-height:44px;padding:9px 20px;font-size:16px}.eyebrow{margin-bottom:6px}.address{font-size:12px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <section class="content" aria-labelledby="title">
      <header class="intro">
        <p class="eyebrow">Четыре великих ума</p>
        <h1 id="title">Эллада</h1>
        <p class="subtitle">Наведите камеру iPhone или iPad<br>на QR-код, чтобы открыть приложение.</p>
      </header>
      <div class="qr"><img src="./assets/qr-link.png" width="590" height="590" alt="QR-код приложения Эллада: https://evgk724.github.io/human-story/hellas-atlas/"></div>
      <div class="actions">
        <a class="open" href="./index.html">Открыть приложение</a>
        <a class="download" href="./assets/qr-link.png" download="hellas-qr.png">Скачать QR-код</a>
        <p class="address">evgk724.github.io/human-story/hellas-atlas/</p>
      </div>
    </section>
  </main>
</body>
</html>
